[tool.poetry]
name = "openai-realtime-voice-agent"
version = "0.1.0"
description = "Home Assistant addon for OpenAI Realtime API voice control with WebSocket support using Pipecat"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "app", from = "."}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Pinned exactly: this codebase targets the Pipecat 1.x API (LLMContext +
# LLMContextAggregatorPair, OpenAIRealtimeLLMService.Settings, PipelineWorker /
# WorkerRunner, FrameSerializer without FrameSerializerType). 1.10.0 is the
# version this was migrated to and tested against (see
# docs/LIVE1-PHASE1-REPORT.md); pipecat still ships behaviour changes in minor
# releases, so bump deliberately. On any Pipecat upgrade, verify the custom
# mixed transport against its websocket client, callbacks, and input/output
# internals, and SafeRealtimeLLMService against the realtime service source.
# Extras: "mcp" = MCP client for the Home Assistant MCP Server tools;
# "websocket" = FastAPI websocket transport; "openai" is empty in 1.x (the
# openai SDK is a core dependency now) but kept for clarity. "google" pulls in
# google-genai for GeminiLiveLLMService (app/gemini_live_service.py); it also
# drags in google-cloud-speech/texttospeech, which we do not use.
pipecat-ai = {extras = ["mcp", "openai", "websocket", "google"], version = "1.10.0"}
# Used directly by app/ (timers, enrollment, ha_sensors, openclaw_tool). Up to
# pipecat 0.0.97 it arrived transitively via the openai SDK; openai 3.x (pulled
# in by pipecat 1.10) depends on httpx2 instead, so it must be explicit.
httpx = ">=0.27.0"
python-dotenv = ">=1.0.0"
# Voice-print speaker ID (fork): ONNX speaker-embedding runtime. Ships
# manylinux aarch64/amd64 wheels; the model file itself is fetched in the
# Dockerfile (small, pinned).
sherpa-onnx = ">=1.10.0"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.23.0"}
websockets = ">=13.0"

[tool.poetry.scripts]
start = "app.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
